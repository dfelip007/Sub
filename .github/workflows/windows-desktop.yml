name: Aplicativo Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'demo/**'
      - 'test/**'
      - 'package*.json'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm ci --no-audit --no-fund
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: npm run prepare:app
        working-directory: desktop
      - run: npm run check
        working-directory: desktop
      - run: npm run test:app
        working-directory: desktop
      - run: npm run build:win
        working-directory: desktop
      - name: Checksum do executável
        shell: pwsh
        run: |
          Get-ChildItem desktop/dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -LiteralPath ($_.FullName + '.sha256')
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Meaple-Windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
