name: Aplicativo Windows
on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'demo/**'
      - 'test/**'
      - 'package*.json'
      - 'scripts/**'
      - 'docs/**'
      - 'AGENTS.md'
      - 'COMECE-AQUI.md'
      - 'README.md'
      - '.gitignore'
      - '.github/workflows/windows-desktop.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: node scripts/ci-run.cjs npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/ci-run.cjs npm test
      - run: node ../scripts/ci-run.cjs npm ci --no-audit --no-fund
        working-directory: desktop
      - run: node ../scripts/ci-run.cjs npm test
        working-directory: desktop
      - run: node ../scripts/ci-run.cjs npm run prepare:app
        working-directory: desktop
      - run: node ../scripts/ci-run.cjs npm run check
        working-directory: desktop
      - run: node ../scripts/ci-run.cjs npm run test:app
        working-directory: desktop
      - run: node ../scripts/ci-run.cjs npm run build:win
        working-directory: desktop
      - name: Checksum do executável
        shell: pwsh
        run: |
          Get-ChildItem desktop/dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii -LiteralPath ($_.FullName + '.sha256')
          }
      - name: Conferir aplicativo e preparar ZIP sem cadastros
        run: node ../scripts/ci-run.cjs node scripts/share.cjs
        working-directory: desktop
      - name: Preparar código-fonte e projeto completo para Codex
        run: node scripts/ci-run.cjs node scripts/package-project.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Submundo-Windows-x64
          path: |
            desktop/dist/share/*
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Submundo-Codigo-Fonte-Codex
          path: desktop/dist/source/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: Submundo-Projeto-Completo-Windows-x64
          path: desktop/dist/project/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
